name: CI

on:
  push:
    branches: [ main, master, final/delivery ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend tests (Postgres + Mongo services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.CI_DB_USER }}" --health-interval 10s --health-timeout 5s --health-retries 5
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Wait for DBs
        run: |
          echo "Waiting for Postgres and Mongo to be ready..."
          for i in {1..15}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 2
          done

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Prepare Prisma and DB
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          MONGODB_URI: ${{ secrets.CI_MONGODB_URI }}
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: ${{ secrets.CI_DB_USER }}
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_NAME: ${{ secrets.CI_DB_NAME }}
          MONGODB_URI: ${{ secrets.CI_MONGODB_URI }}
        run: |
          npm test -- --runInBand

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: backend-tests
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false

  deploy-to-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: frontend-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy backend to Vercel (backend project root)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
          vercel-args: '--cwd backend --prod'
      - name: Deploy frontend to Vercel (frontend project root)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          vercel-args: '--cwd frontend --prod'
