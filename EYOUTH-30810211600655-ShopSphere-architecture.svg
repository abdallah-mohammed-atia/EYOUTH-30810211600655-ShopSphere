<!-- Simple architecture diagram (frontend -> backend -> database) -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300">
  <rect x="40" y="80" width="200" height="100" fill="#e6f2ff" stroke="#007acc" />
  <text x="140" y="130" font-size="14" text-anchor="middle">Frontend (Vercel)</text>

  <rect x="300" y="80" width="200" height="100" fill="#e6ffe6" stroke="#00a000" />
  <text x="400" y="130" font-size="14" text-anchor="middle">Backend (Vercel Serverless)</text>

  <rect x="560" y="80" width="200" height="100" fill="#fff2cc" stroke="#b58900" />
  <text x="660" y="130" font-size="14" text-anchor="middle">Database (Supabase Postgres)</text>

  <line x1="240" y1="130" x2="300" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="500" y1="130" x2="560" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="140" y="160" font-size="12" text-anchor="middle" fill="#555">Public frontend URL (HTTPS)</text>
  <text x="400" y="160" font-size="12" text-anchor="middle" fill="#555">API endpoints (/api/*) with CORS/Helmet/RateLimit</text>
  <text x="660" y="160" font-size="12" text-anchor="middle" fill="#555">Production Postgres (Supabase) — read & write</text>
</svg>
